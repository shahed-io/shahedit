  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Blank-screen guard + error capture overlay.
      // - Captures console errors and window errors from the very first paint
      // - If #root never mounts within 6s (preview) / 10s (production), shows a
      //   visible overlay with the captured errors and a Retry button
      // - In Lovable preview iframes, also tries ONE cache-bust reload first
      (function () {
        var errors = [];
        var MAX = 25;
        function pushErr(kind, msg, stack) {
          try {
            var s = String(msg || "");
            if (stack) s += "\n" + String(stack);
            errors.push("[" + kind + "] " + s);
            if (errors.length > MAX) errors.shift();
          } catch (e) {}
        }
        var _err = console.error;
        console.error = function () {
          try {
            var parts = [];
            for (var i = 0; i < arguments.length; i++) {
              var a = arguments[i];
              parts.push(a && a.stack ? a.stack : (typeof a === "object" ? JSON.stringify(a) : String(a)));
            }
            pushErr("console.error", parts.join(" "));
          } catch (e) {}
          return _err.apply(console, arguments);
        };
        window.addEventListener("error", function (e) {
          pushErr("window.error", (e && (e.message || e.error && e.error.message)) || "error",
            e && e.error && e.error.stack);
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          pushErr("promise", r && (r.message || r) || "unhandled rejection", r && r.stack);
        });

        var host = location.hostname;
        var inIframe = (function () { try { return window.top !== window.self; } catch (_) { return true; } })();
        var isPreview =
          host.indexOf("lovableproject.com") !== -1 ||
          host.indexOf("lovable.app") !== -1 ||
          host.indexOf("lovable.dev") !== -1 ||
          host === "localhost" ||
          host === "127.0.0.1";
        var TIMEOUT = isPreview ? 6000 : 10000;

        function mounted() {
          var r = document.getElementById("root");
          return !!(r && r.childElementCount > 0);
        }

        function showOverlay() {
          if (document.getElementById("__lov_error_overlay__")) return;
          var wrap = document.createElement("div");
          wrap.id = "__lov_error_overlay__";
          wrap.style.cssText =
            "position:fixed;inset:0;z-index:2147483647;background:rgba(10,5,20,0.96);" +
            "color:#f5f0fa;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;" +
            "padding:24px;overflow:auto;display:flex;align-items:flex-start;justify-content:center;";
          var body = errors.length
            ? errors.map(function (e) {
                return '<pre style="white-space:pre-wrap;word-break:break-word;background:#1a0f2e;border:1px solid #3b2560;border-radius:8px;padding:12px;margin:8px 0;color:#ffb4b4;font-size:12.5px;line-height:1.5;">' +
                  e.replace(/[&<>]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }) +
                  "</pre>";
              }).join("")
            : '<p style="opacity:.75">কোনো JS error capture হয়নি — সম্ভবত network/loading আটকে আছে বা bundle load হয়নি।</p>';
          wrap.innerHTML =
            '<div style="max-width:820px;width:100%;">' +
              '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">' +
                '<div style="width:36px;height:36px;border-radius:50%;background:#e11d48;display:flex;align-items:center;justify-content:center;font-weight:700;">!</div>' +
                '<h2 style="margin:0;font-size:20px;">ওয়েবসাইট load হচ্ছে না</h2>' +
              '</div>' +
              '<p style="margin:0 0 8px;opacity:.8;font-size:14px;">অ্যাপ ' + Math.round(TIMEOUT/1000) + ' সেকেন্ডে render হয়নি। নিচে captured errors দেখানো হলো।</p>' +
              '<div style="margin:14px 0;">' + body + '</div>' +
              '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
                '<button id="__lov_retry__" style="background:#7c3aed;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;">পুনরায় লোড করুন</button>' +
                '<button id="__lov_hard__" style="background:#1a0f2e;color:#f5f0fa;border:1px solid #3b2560;border-radius:8px;padding:10px 16px;cursor:pointer;">Hard reload (cache clear)</button>' +
                '<button id="__lov_copy__" style="background:#1a0f2e;color:#f5f0fa;border:1px solid #3b2560;border-radius:8px;padding:10px 16px;cursor:pointer;">Copy errors</button>' +
              '</div>' +
            '</div>';
          document.body.appendChild(wrap);
          document.getElementById("__lov_retry__").onclick = function () { location.reload(); };
          document.getElementById("__lov_hard__").onclick = function () {
            var u = new URL(location.href);
            u.searchParams.set("_r", Date.now().toString(36));
            location.replace(u.toString());
          };
          document.getElementById("__lov_copy__").onclick = function () {
            try {
              navigator.clipboard.writeText(errors.join("\n\n") || "(no errors captured)");
              this.textContent = "Copied ✓";
            } catch (_) {}
          };
        }

        // Preview iframe: one silent cache-bust reload attempt before overlay
        setTimeout(function () {
          if (mounted()) return;
          if (inIframe && isPreview && !sessionStorage.getItem("__lov_preview_reloaded__")) {
            sessionStorage.setItem("__lov_preview_reloaded__", "1");
            var u = new URL(location.href);
            u.searchParams.set("_r", Date.now().toString(36));
            location.replace(u.toString());
            return;
          }
          showOverlay();
        }, TIMEOUT);

        // Clear guards when mounted
        var poll = setInterval(function () {
          if (mounted()) {
            sessionStorage.removeItem("__lov_preview_reloaded__");
            clearInterval(poll);
          }
        }, 1000);
      })();
    </script>
